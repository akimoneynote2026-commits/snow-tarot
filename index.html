  #instruction { font-size: 15px; font-weight: bold; color: #e59866; min-height: 24px; margin-bottom: 12px; }

  .mode-selector {
    display: inline-flex;
    background-color: #f4ece8;
    padding: 4px;

    margin-bottom: 20px;

  }
  .mode-btn {
    background: none;
    border: none;
    padding: 8px 18px;
    font-size: 13px;
    font-weight: bold;
    color: #a89490;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .mode-btn.active {
    background-color: #ba7a72;
    color: white;
    box-shadow: 0 4px 10px rgba(186, 122, 114, 0.25);
  }

  /* カード配置エリア */
  .single-card-area {
    display: block;
    margin-bottom: 15px;
  }
  .three-cards-area {
    display: none;
    justify-content: center;
    gap: 8px;
    margin: 0 auto 15px auto;
    max-width: 480px;
  }

  .card-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .card-label {
    font-size: 11px;
    font-weight: bold;
    color: #fff;
    background-color: #ba7a72;
    padding: 2px 10px;
    border-radius: 10px;
    margin-bottom: 6px;
    opacity: 0.9;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  }
  
  /* カード自体のスタイルと3D演出 */
  .card-container { perspective: 1000px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  
  .single-card-area .card-container {
    width: 200px;
    height: 300px;
    margin: 0 auto;
  }
  .three-cards-area .card-container {
    width: 95px;
    height: 142px;
  }
  @media (min-width: 400px) {
    .three-cards-area .card-container {
      width: 115px;
      height: 172px;
    }
  }
  @media (min-width: 480px) {
    .three-cards-area .card-container {
      width: 130px;
      height: 195px;
    }
  }

  .card { 
    width: 100%; 
    height: 100%; 
    transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    transform-style: preserve-3d; 
    position: relative; 
    box-shadow: 0 6px 15px rgba(0,0,0,0.08); 
    border-radius: 12px;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card-face { 
    position: absolute; 
    width: 100%; 
    height: 100%; 
    backface-visibility: hidden; 
    border-radius: 12px; 
    overflow: hidden; 
    border: 3px solid #fff; 
    box-sizing: border-box; 
  }

  .card-front {

  }

  .card-back { 
    background-color: #fff; 
    transform: rotateY(180deg); 
    display: flex; 
    align-items: center; 
    justify-content: center; 
  }
  .card-back img { 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
    border-radius: 9px; 
  }
  
  /* 結果テキストボックス */
  .result-box { 
    margin-top: 20px; 
    padding: 20px; 
    border-radius: 12px; 
    background: rgba(255,255,255,0.92); 
    box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
    display: none; 
    max-width: 460px; 
    margin-left: auto; 
    margin-right: auto; 
    text-align: left; 
    opacity: 0; 
    transition: opacity 0.5s ease; 
  }
  .result-box.show { display: block; opacity: 1; }
  
  .result-item { margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px dashed #f5dcd9; }
  .result-item:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  
  .res-badge { display: inline-block; font-size: 10px; font-weight: bold; color: #fff; background-color: #e59866; padding: 1px 8px; border-radius: 10px; margin-bottom: 6px; }
  .res-title { font-size: 16px; font-weight: bold; color: #d98880; margin-top: 0; margin-bottom: 6px; }

  .pdf-cta-mini {
    display: none;
    margin-top: 22px;
    padding-top: 12px;

    text-align: center;

  }
  .pdf-cta-mini-note {

    color: #c4bfba;

  }
  .res-message { font-size: 13.5px; line-height: 1.6; color: #5a5a5a; margin-bottom: 0; }
  
  button.action-btn { background-color: #8caec6; color: white; border: none; padding: 12px 30px; font-size: 15px; font-weight: bold; border-radius: 30px; cursor: pointer; display: none; margin-top: 15px; box-shadow: 0 4px 10px rgba(140, 174, 198, 0.3); transition: transform 0.2s; }

</style>

  let currentMode = 'one';
  let isOneFlipped = false;
  let threeCardsState = [
    { flipped: false, card: null, selectedMessageText: null },
    { flipped: false, card: null, selectedMessageText: null },
    { flipped: false, card: null, selectedMessageText: null }
  ];

  window.addEventListener('DOMContentLoaded', () => {
    setupFrontBackFaces();
    prepareCards();
  });

  function setupFrontBackFaces() {
    // フォルダ内の「ura001.png」が問題なく指定されているかチェックします。
    // JSから余計な背景流し込みは行わず、CSS側の設定（background）を基本とするため、JSは最小限のログのみにします。
    console.log("裏面画像（ura001.png）が設定されました。");
  }

  function prepareCards() {
    const randomIdx = Math.floor(Math.random() * cards.length);
    window.selectedOneCard = cards[randomIdx];

    let shuffled = [...cards].sort(() => 0.5 - Math.random());
    threeCardsState[0].card = shuffled[0];
    threeCardsState[1].card = shuffled[1];
    threeCardsState[2].card = shuffled[2];
  }

  function switchMode(mode) {
    if (currentMode === mode) return;
    currentMode = mode;
    
    document.getElementById('btnModeOne').classList.toggle('active', mode === 'one');
    document.getElementById('btnModeThree').classList.toggle('active', mode === 'three');
    
    document.getElementById('singleCardArea').style.display = mode === 'one' ? 'block' : 'none';
    document.getElementById('threeCardsArea').style.display = mode === 'three' ? 'flex' : 'none';
    
    resetAll();
  }

  function flipSingleCard() {
    if (isOneFlipped) return;
    isOneFlipped = true;
    
    const cardData = window.selectedOneCard;
    
    // お節介なSVG自動生成は一切やめ、シンプルなローカルフォルダアセット（000.pngなど）のimg指定にします。
    const fallbackHTML = `
      <div class="fallback-card-content" id="oneCardFallback">
        <div class="fallback-icon">❄️</div>
        <div class="fallback-title">${cardData.title}</div>
        <div class="fallback-subtext">画像の読み込み中ちゅん…✨</div>
      </div>
    `;
    
    const imgHTML = `
      <img src="${cardData.image}" alt="${cardData.title}" 
           onerror="handleImageError(this, 'oneCardFallback')" 
           onload="handleImageLoad(this, 'oneCardFallback')"
           id="oneCardImg"
           style="display:none; width:100%; height:100%;">
    `;
    
    document.getElementById('oneCardResult').innerHTML = fallbackHTML + imgHTML;
    document.getElementById('oneCard').classList.add('flipped');
    document.getElementById('instruction').innerText = "今日のあなたへのメッセージ ❄️✨";
    
    const subIdx = Math.floor(Math.random() * 3);
    const selectedMessage = cardData.messages[0][subIdx];
    
    setTimeout(() => {
      const container = document.getElementById('resultItemsContainer');
      container.innerHTML = `
        <div class="result-item">
          <div class="res-badge">今日の一枚</div>
          <h2 class="res-title">${cardData.title}</h2>
          <p class="res-message">${selectedMessage}</p>
        </div>
      `;
      
      const resultBox = document.getElementById('resultBox');
      resultBox.classList.add('show');
      document.getElementById('resetBtn').style.display = 'inline-block';
      document.getElementById('pdfCtaMini').style.display = 'block';
      resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 450);
  }

  function flipThreeCard(index) {
    if (threeCardsState[index].flipped) return;
    threeCardsState[index].flipped = true;
    
    const state = threeCardsState[index];
    const cardData = state.card;
    const positionLabels = ["過去", "現在", "未来"];
    const positionLabel = positionLabels[index];
    
    // 画像ロード中のシンプルな可愛い仮テキスト
    const fallbackHTML = `
      <div class="fallback-card-content" id="threeCardFallback_${index}">
        <div class="fallback-icon">❄️</div>
        <div class="fallback-title">${cardData.title}</div>
        <div class="fallback-subtext">${positionLabel}のあなたへ✨</div>
      </div>
    `;
    
    const imgHTML = `
      <img src="${cardData.image}" alt="${cardData.title}" 
           onerror="handleImageError(this, 'threeCardFallback_${index}')" 
           onload="handleImageLoad(this, 'threeCardFallback_${index}')"
           id="threeCardImg_${index}"
           style="display:none; width:100%; height:100%;">
    `;
    
    document.getElementById('threeCardResult' + index).innerHTML = fallbackHTML + imgHTML;
    document.getElementById('threeCard' + index).classList.add('flipped');
    
    renderThreeCardsResult();
  }

  function renderThreeCardsResult() {
    const container = document.getElementById('resultItemsContainer');
    let htmlContent = '';
    const positionLabels = ["過去（これまでの歩み）", "現在（今のあなたへ）", "未来（これからのハッピー）"];
    
    let flippedCount = 0;
    
    for (let i = 0; i < 3; i++) {
      if (threeCardsState[i].flipped) {
        flippedCount++;
        const cardData = threeCardsState[i].card;
        const msgIndex = i + 1; 
        
        if (!threeCardsState[i].selectedMessageText) {
          const subIdx = Math.floor(Math.random() * 3);
          threeCardsState[i].selectedMessageText = cardData.messages[msgIndex][subIdx];
        }
        
        htmlContent += `
          <div class="result-item">
            <div class="res-badge" style="background-color: #8caec6;">${positionLabels[i]}</div>
            <h2 class="res-title">${cardData.title}</h2>
            <p class="res-message">${threeCardsState[i].selectedMessageText}</p>
          </div>
        `;
      }
    }
    
    if (flippedCount > 0) {
      container.innerHTML = htmlContent;
      const resultBox = document.getElementById('resultBox');
      resultBox.classList.add('show');
      
      if (flippedCount === 3) {
        document.getElementById('instruction').innerText = "過去、現在、未来。すべて全肯定だよ！❄️✨";
        document.getElementById('resetBtn').style.display = 'inline-block';
        document.getElementById('pdfCtaMini').style.display = 'block';
      } else {
        document.getElementById('instruction').innerText = "残りのカードもめくってみてね！";
      }
      
      resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }

  // 画像が正常に読み込めたら、imgタグをパッと表示し、読み込み中の仮文字を非表示にします。
  function handleImageLoad(img, fallbackId) {
    img.style.display = 'block';
    const fallbackDiv = document.getElementById(fallbackId);
    if (fallbackDiv) {
      fallbackDiv.style.opacity = '0';
      setTimeout(() => { fallbackDiv.style.display = 'none'; }, 200);
    }
  }

  // もしフォルダ内にまだ画像が未存在なカードがある場合は、エラーマークを出さず、文字情報をきれいに表示し続けます。
  function handleImageError(img, fallbackId) {
    img.style.display = 'none';
    const fallbackDiv = document.getElementById(fallbackId);
    if (fallbackDiv) {
      fallbackDiv.style.display = 'flex';
      fallbackDiv.style.opacity = '1';
    }
  }

  function resetAll() {
    isOneFlipped = false;
    threeCardsState = [
      { flipped: false, card: null, selectedMessageText: null },
      { flipped: false, card: null, selectedMessageText: null },
      { flipped: false, card: null, selectedMessageText: null }
    ];
    
    document.getElementById('instruction').innerText = "タップしてカードをひいてね";
    document.getElementById('resultBox').classList.remove('show');
    document.getElementById('resetBtn').style.display = 'none';
    document.getElementById('pdfCtaMini').style.display = 'none';
    
    const oneCard = document.getElementById('oneCard');
    oneCard.classList.remove('flipped');
    
    for (let i = 0; i < 3; i++) {
      const threeCard = document.getElementById('threeCard' + i);
      if (threeCard) {
        threeCard.classList.remove('flipped');
      }
    }
    
    setupFrontBackFaces();
    prepareCards();
  }
</script>
